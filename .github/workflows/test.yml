name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.1', '3.4', '4.0']
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Test Ruby, HLS conversion, and player logic
        run: bundle exec rake check
      - name: Build and install the gem
        run: |
          bundle exec rake build
          gem install --local pkg/miniradio_server-*.gem --no-document
          cd "$(mktemp -d)"
          miniradio_server --version
          miniradio_server --help
