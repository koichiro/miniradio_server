name: Quality checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ruby: ['3.4', '4.0.7']
    steps:
      - uses: actions/checkout@v7
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby }}
          bundler-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Lint with Standard
        run: bundle exec rake lint
      - name: Test Ruby with 90% coverage and player logic
        id: tests
        run: bundle exec rake test test_player
      - name: Upload coverage report
        if: always() && steps.tests.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ruby-${{ matrix.ruby }}
          path: coverage/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
      - name: Build and install the gem
        run: |
          bundle exec rake build
          gem install pkg/miniradio_server-*.gem --no-document
          cd "$(mktemp -d)"
          miniradio_server --version
          miniradio_server --help
